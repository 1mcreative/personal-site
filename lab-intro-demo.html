<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Standalone iframe target for the Component Lab's "Intro Sequence"
     capstone demo — a minimal page running the exact three scripts the
     real homepage does (intro-sequence.js, scramble-intro.js, globe.js)
     against the exact same markup. Isolated in its own document/iframe
     rather than embedded inline in lab.md: all three scripts use
     document.querySelector for their singleton target elements, so a
     second on-page instance (e.g. the Lab's own separate Globe demo
     card) would otherwise fight over which element is "the" globe. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/tokens.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}">
<style>
  html, body { margin: 0; height: 100%; }
  .hero { min-height: 100%; }
</style>
</head>
<body class="theme-home">
<section class="hero">
  <div class="intro-splash" aria-hidden="true"></div>
  <div class="hero-globe" aria-hidden="true">
    <canvas class="hero-globe-canvas"></canvas>
  </div>
  <canvas class="hero-glitter" aria-hidden="true"></canvas>
  <div class="hero-inner">
    <h1>Hi, I'm <span class="name-kinetic-wrap"><span class="pixel-name-plain name-kinetic-plain dynamic-weight">Bhavesh</span></span>.</h1>
    <p class="hero-sub"><span class="hero-sub-text">I write backend systems for a living, and I'm a lot less organized about everything else.</span></p>
  </div>
</section>
<script src="{{ '/assets/js/scramble-intro.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/intro-sequence.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/globe.js' | relative_url }}" defer></script>
</body>
</html>
