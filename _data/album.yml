# Photo album for /life/. Empty by default — the slider still renders and
# works with gradient placeholder tiles (see photo-slider.js) until real
# photos are added here.
#
# Keep only display-size, web-compressed copies here (and in whatever path
# `src` points to) — not full-resolution originals. Anyone who can view the
# site can view/screenshot these regardless of any front-end protection, so
# treat what's public here as "good enough to preview," not the real asset.
# Originals stay off the site and go out by email on request (see the
# "Email me" link the modal already builds from site.email in _config.yml).
#
# Fields:
#   src      - string, required. Image URL or a local /assets/img/... path.
#   alt      - string, optional. Real alt text (defaults to empty).
#   offsetY  - number, optional. Shifts the image's object-position (px)
#              if a photo needs reframing within its square crop.
#   caption  - string, optional. The story behind the photo, shown when
#              someone taps it open.
#   location - string, optional. Where it was taken, e.g. "Goa, India".
#   date     - string, optional. Free text, e.g. "March 2025".
#
# Example:
# - src: /assets/img/life/01.jpg
#   alt: "Sunset in Goa"
#   offsetY: -20
#   caption: "Last evening of the Goa trip, right before the flight back."
#   location: "Goa, India"
#   date: "March 2025"

- src: /assets/img/life/01.jpg
  alt: "Sunset over Gudibanda lake"
  caption: "Lovely sunset view at Gudibanda lake, just outside Bengaluru."
  location: "Gudibanda Lake, near Bengaluru"
  date: "6:22 PM"
