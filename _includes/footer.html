<footer class="site-footer">
  <p>&copy; {{ 'now' | date: "%Y" }} Bhavesh Nakum.
    <a href="mailto:{{ site.email }}" class="contact-btn" data-contact-open>Contact me</a>
  </p>
</footer>

<!-- Contact modal — shared across every page that includes footer.html, not
     scoped to one theme, so it reads entirely off the page's own --bg/
     --text/--surface/--border/--accent tokens (see tokens.css). The trigger
     above is a real mailto: link first, upgraded to this modal by JS below
     — no-JS visitors still get a working way to reach out. -->
<div class="contact-modal" data-contact-modal hidden>
  <div class="contact-modal-backdrop" data-contact-close></div>
  <div class="contact-modal-panel" role="dialog" aria-modal="true" aria-labelledby="contact-modal-title">
    <button type="button" class="contact-modal-close" data-contact-close aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <h2 id="contact-modal-title">Get in touch</h2>
    <p class="contact-modal-sub">Comments, feedback, appreciation, bug reports — whatever's on your mind.</p>
    <form class="contact-form" data-contact-form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <label class="contact-field">
        <span>Name</span>
        <input type="text" name="name" required autocomplete="name">
      </label>
      <label class="contact-field">
        <span>Email</span>
        <input type="email" name="email" required autocomplete="email">
      </label>
      <label class="contact-field">
        <span>Message</span>
        <textarea name="message" rows="5" required></textarea>
      </label>
      <button type="submit" class="contact-submit">Send</button>
      <p class="contact-status" data-contact-status role="status" aria-live="polite"></p>
    </form>
  </div>
</div>
<script src="{{ '/assets/js/contact-modal.js' | relative_url }}" defer></script>
