<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% case page.layout %}
  {% when 'professional' %}{% assign theme-color = '#ffffff' %}
  {% when 'personal' %}{% assign theme-color = '#0f1419' %}
  {% else %}{% assign theme-color = '#12161c' %}
{% endcase %}
<meta name="theme-color" content="{{ theme-color }}">
{% seo %}
<!-- A dedicated Person schema, separate from jekyll-seo-tag's own thin
     WebSite/WebPage block above: this is what actually lets a search
     engine's Knowledge Graph or an AI assistant answering "who is Bhavesh
     Nakum" resolve one consistent entity (jobTitle, employer, education,
     and the same profile links this site already marks rel="me" on).
     Site-wide, not homepage-only, since the person it describes is the
     same on every page. Every field here is a real, verifiable fact from
     the résumé/profile links already on this site, nothing invented. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ site.author }}",
  "url": "{{ site.url }}",
  "email": "mailto:{{ site.email }}",
  "jobTitle": "Senior Software Engineer",
  "worksFor": {
    "@type": "Organization",
    "name": "eBay"
  },
  "alumniOf": {
    "@type": "CollegeOrUniversity",
    "name": "Sardar Vallabhbhai National Institute of Technology, Surat"
  },
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Bengaluru",
    "addressCountry": "IN"
  },
  "knowsAbout": ["Backend Architecture", "Java", "Python", "Spring Boot", "Apache Kafka", "Distributed Systems", "Microsoft Azure", "Kubernetes", "AI Agent Workflows", "Cloud Data Platforms", "Microservices"],
  "sameAs": [
    "https://www.linkedin.com/in/bhaveshnakum7",
    "https://github.com/1mcreative",
    "https://www.instagram.com/1mcreative"
  ]
}
</script>
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/sitemap.xml' | absolute_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fraunces upright range widened to 400..900 (was two static weights,
     500/600) for .dynamic-weight's hover-to-bold transition on the
     homepage name — Fraunces is a variable font, so this is genuine
     weight interpolation on the one loaded file, not synthetic bolding,
     and the wider range still covers the 500/600 used everywhere else. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/tokens.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/' | append: page.layout | append: '.css' | relative_url }}">
{% if page.extra-css %}<link rel="stylesheet" href="{{ page.extra-css | relative_url }}">{% endif %}
