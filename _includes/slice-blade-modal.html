<!-- Slice Blade modal — included from footer.html (which covers /resume/,
     /life/, /lab/) and directly from _layouts/home.html, since the
     homepage has no footer at all by deliberate, long-standing design.
     One shared include either way, rather than duplicating this markup:
     reads the page's own theme tokens (see assets/js/slice-blade.js),
     not scoped to one theme, same as the contact modal it mirrors. -->
<div class="contact-modal slice-blade-modal" data-slice-blade-modal hidden>
  <div class="contact-modal-backdrop" data-slice-blade-close></div>
  <div class="contact-modal-panel slice-blade-panel" role="dialog" aria-modal="true" aria-labelledby="slice-blade-title">
    <button type="button" class="contact-modal-close slice-blade-close" data-slice-blade-close aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="slice-blade-header">
      <h2 class="slice-blade-title" id="slice-blade-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 19L19 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M13 5h6v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="slice-blade-title-text">Slice Blade</span>
      </h2>
      <div class="slice-blade-hud">
        <span class="slice-blade-hud-chip" data-slice-blade-score>Score 0</span>
        <span class="slice-blade-hud-chip slice-blade-hud-lives" data-slice-blade-lives aria-label="Lives remaining"></span>
      </div>
    </div>
    <div class="slice-blade-host" data-slice-blade-host>
      <canvas data-slice-blade-canvas></canvas>
      <!-- Rules live on the canvas, not in a block above it: the old
           paragraph wrapped to 4-5 lines on a phone and took more room
           than the game. It fades out after a human's first slice (see
           updateHud in slice-blade.js) and comes back when the demo
           takes over again. Pieces never rise into the top quarter of
           the canvas, so this never covers the action. -->
      <div class="slice-blade-notes">
        <p class="slice-blade-challenge" data-slice-blade-challenge hidden></p>
        <p class="slice-blade-hint" data-slice-blade-hint>Swipe across the letters to slice them. Avoid the X bombs.</p>
      </div>
      <!-- Overlaid on the canvas, not a block below it — a block below
           added real height to the modal panel and pushed the share
           buttons past the viewport on short screens, forcing a scroll
           right when they should be the one thing in view. Overlaying
           inside .slice-blade-host (same technique .slice-blade-notes
           uses) means game-over adds zero new height: whatever
           already fit without scrolling still fits. -->
      <div class="slice-blade-share" data-slice-blade-share hidden>
        <p class="slice-blade-share-score">Score <strong data-slice-blade-share-score>0</strong>. Share it?</p>
        <div class="slice-blade-share-actions">
          <button type="button" class="slice-blade-share-btn slice-blade-share-btn-primary" data-slice-blade-again>Play again</button>
          <button type="button" class="slice-blade-share-btn" data-slice-blade-share-native hidden>Share</button>
          <button type="button" class="slice-blade-share-btn" data-slice-blade-share-whatsapp>WhatsApp</button>
          <button type="button" class="slice-blade-share-btn" data-slice-blade-share-instagram>Instagram</button>
          <button type="button" class="slice-blade-share-btn" data-slice-blade-share-linkedin>LinkedIn</button>
          <button type="button" class="slice-blade-share-btn" data-slice-blade-share-copy>Copy link</button>
          <button type="button" class="slice-blade-share-btn" data-slice-blade-share-save>Save image</button>
        </div>
        <p class="slice-blade-share-note" data-slice-blade-share-note aria-live="polite"></p>
      </div>
    </div>
  </div>
</div>
<script src="{{ '/assets/js/slice-blade.js' | relative_url }}" defer></script>
