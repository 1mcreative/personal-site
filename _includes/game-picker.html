<!-- Game picker — the "Getting bored?" triggers open this; each card then
     opens its game through that game's own data-*-open hook. -->
<div class="contact-modal" data-game-picker hidden>
  <div class="contact-modal-backdrop" data-game-picker-close></div>
  <div class="contact-modal-panel game-picker-panel" role="dialog" aria-modal="true" aria-labelledby="game-picker-title">
    <button type="button" class="contact-modal-close" data-game-picker-close aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <h2 class="game-picker-heading" id="game-picker-title">Pick a game</h2>
    <div class="game-picker-grid">
      <button type="button" class="game-card" data-slice-blade-open>
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 19L19 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M13 5h6v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="game-card-name">Slice Blade</span>
        <span class="game-card-desc">Swipe through falling letters. Dodge the bombs.</span>
      </button>
      <button type="button" class="game-card" data-glide-open>
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 11l18-7-7 18-2.5-7.5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span class="game-card-name">Glide</span>
        <span class="game-card-desc">Steer a paper plane through the gates. Space to climb.</span>
      </button>
    </div>
  </div>
</div>
<script src="{{ '/assets/js/game-picker.js' | relative_url }}" defer></script>
