{% comment %}
  Clock character for the homepage's time tile (index.md; styled as .hero-clock-mascot
  in home.css; driven by assets/js/hero.js). An original rubber-hose cartoon clock in the
  1930s style the owner pointed at ("calm, a bit evil from the inside"), drawn from scratch:
  a round orange face with dial dots, big half-lidded eyes that follow the cursor, a calm
  smile with a smirk it keeps for people it is watching, white gloves clasped in front, and
  noodle legs. No hands cover the face; the time is read off the dial instead: the white dot
  on the ticks is the hour, the white bead on the rim is the minute (hero.js sets --r on both
  [data-hand]s), and the brown dot stepping around the rim is the second (a 60s steps() loop
  started at the current second). Pupils get --ex/--ey from hero.js (SVG user units).
  Every moving group sets its own pivot in view-box coordinates in home.css (.wxk-*).
{% endcomment %}
<svg class="hero-clock-mascot" viewBox="0 0 64 76" fill="none" aria-hidden="true">
  <defs>
    <clipPath id="wxk-eye-l"><ellipse cx="24.6" cy="27.4" rx="6.1" ry="7.5"/></clipPath>
    <clipPath id="wxk-eye-r"><ellipse cx="39.4" cy="27.4" rx="6.1" ry="7.5"/></clipPath>
  </defs>
  <ellipse cx="32" cy="73.6" rx="12.5" ry="1.7" fill="rgba(20,23,28,.13)"/>
  <g class="wxk-sway">
    <path d="M26.6 49Q25.2 58.6 26.4 66M37.4 49Q38.8 58.6 37.6 66" stroke="#1f2733" stroke-width="2.2" stroke-linecap="round"/>
    <ellipse cx="24.2" cy="68.6" rx="5.2" ry="2.7" fill="#fff" stroke="#1f2733" stroke-width="1.1"/>
    <g class="wxk-tap"><ellipse cx="39.8" cy="68.6" rx="5.2" ry="2.7" fill="#fff" stroke="#1f2733" stroke-width="1.1"/></g>
    <circle cx="32" cy="30" r="22" fill="#f59e0b" stroke="#1f2733" stroke-width="1.7"/>
    <ellipse cx="22.4" cy="15.8" rx="9" ry="4.6" transform="rotate(-34 22.4 15.8)" fill="#fff" opacity=".2"/>
    <path d="M32 13.2V9.8M48.8 30H52.2M32 46.8V50.2M15.2 30H11.8" stroke="#7c2d12" stroke-width="1.6" stroke-linecap="round" opacity=".72"/>
    <path d="M41.5 13.55h.01M48.45 20.5h.01M48.45 39.5h.01M41.5 46.45h.01M22.5 46.45h.01M15.55 39.5h.01M15.55 20.5h.01M22.5 13.55h.01" stroke="#7c2d12" stroke-width="1.5" stroke-linecap="round" opacity=".6"/>
    <g class="wxk-hand" data-hand="h" style="--r:0deg"><circle cx="32" cy="12.4" r="1.9" fill="#fff" stroke="#1f2733" stroke-width="1"/></g>
    <g class="wxk-hand" data-hand="m" style="--r:0deg"><circle cx="32" cy="8" r="1.6" fill="#fff" stroke="#1f2733" stroke-width="1"/></g>
    <g class="wxk-orbit"><circle cx="32" cy="9.5" r=".95" fill="#7c2d12"/></g>
    <ellipse cx="24.6" cy="27.4" rx="6.1" ry="7.5" fill="#fff"/>
    <ellipse cx="39.4" cy="27.4" rx="6.1" ry="7.5" fill="#fff"/>
    <g clip-path="url(#wxk-eye-l)"><g class="wxk-glance"><g class="wxk-eyes">
      <circle cx="24.6" cy="28.4" r="3.4" fill="#1f2733"/><circle cx="25.8" cy="26.9" r="1" fill="#fff"/>
      <path class="wxk-glint" d="M27.9 24.6L28.4 25.8 29.6 26.3 28.4 26.8 27.9 28 27.4 26.8 26.2 26.3 27.4 25.8Z" fill="#fff"/>
    </g></g></g>
    <g clip-path="url(#wxk-eye-r)"><g class="wxk-glance"><g class="wxk-eyes">
      <circle cx="39.4" cy="28.4" r="3.4" fill="#1f2733"/><circle cx="40.6" cy="26.9" r="1" fill="#fff"/>
    </g></g></g>
    <g clip-path="url(#wxk-eye-l)"><g class="wxk-lidrest"><g class="wxk-lid">
      <path d="M16 6H33V26.2Q24.6 24.6 16 23.4Z" fill="#f59e0b"/><path d="M17.4 23.7Q24.6 24.9 31.6 26.3" stroke="#1f2733" stroke-width="1.4" stroke-linecap="round"/>
    </g></g></g>
    <g clip-path="url(#wxk-eye-r)"><g class="wxk-lidrest"><g class="wxk-lid">
      <path d="M48 6H31V26.2Q39.4 24.6 48 23.4Z" fill="#f59e0b"/><path d="M46.6 23.7Q39.4 24.9 32.4 26.3" stroke="#1f2733" stroke-width="1.4" stroke-linecap="round"/>
    </g></g></g>
    <ellipse cx="24.6" cy="27.4" rx="6.1" ry="7.5" stroke="#1f2733" stroke-width="1.3"/>
    <ellipse cx="39.4" cy="27.4" rx="6.1" ry="7.5" stroke="#1f2733" stroke-width="1.3"/>
    <path d="M19.7 22.4L17.9 20.6M21.5 20.7L20.5 18.4M44.3 22.4L46.1 20.6M42.5 20.7L43.5 18.4" stroke="#1f2733" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M19 17.8Q24 15.6 30 18.4" stroke="#7c2d12" stroke-width="1.2" stroke-linecap="round" opacity=".85"/>
    <path class="wxk-brow" d="M45 17.8Q40 15.6 34 18.4" stroke="#7c2d12" stroke-width="1.2" stroke-linecap="round" opacity=".85"/>
    <ellipse cx="32" cy="33.6" rx="1.5" ry="1.1" fill="#1f2733"/>
    <g class="wxk-smile"><path d="M25 38.4Q32 44.2 39 38.4M24.4 37.2L25.1 38.6M39.6 37.2L38.9 38.6" stroke="#1f2733" stroke-width="1.5" stroke-linecap="round"/></g>
    <g class="wxk-smirk"><path d="M25 38.8Q31.6 42.8 39.8 36.4M40.6 35.4L39.6 37.2" stroke="#1f2733" stroke-width="1.5" stroke-linecap="round"/></g>
    <path d="M10.6 36Q8.4 47.6 25.4 52" stroke="#1f2733" stroke-width="2.1" stroke-linecap="round"/>
    <g class="wxk-glove"><ellipse cx="29" cy="51.6" rx="4.4" ry="3.1" fill="#fff" stroke="#1f2733" stroke-width="1.1"/><ellipse cx="27.2" cy="48.9" rx="1.7" ry="2.2" transform="rotate(-20 27.2 48.9)" fill="#fff" stroke="#1f2733" stroke-width="1"/></g>
    <g class="wxk-armR">
      <path d="M53.4 36Q55.6 47.6 38.6 52" stroke="#1f2733" stroke-width="2.1" stroke-linecap="round"/>
      <g class="wxk-fingers"><ellipse cx="35" cy="51.6" rx="4.4" ry="3.1" fill="#fff" stroke="#1f2733" stroke-width="1.1"/><ellipse cx="36.8" cy="48.9" rx="1.7" ry="2.2" transform="rotate(20 36.8 48.9)" fill="#fff" stroke="#1f2733" stroke-width="1"/><path d="M33.2 50.6Q34 52 33.4 53.2" stroke="#1f2733" stroke-width=".8" stroke-linecap="round"/></g>
    </g>
    <path class="wxk-spark" d="M55 3Q55 7 59 7Q55 7 55 11Q55 7 51 7Q55 7 55 3Z" fill="#fff" stroke="#1f2733" stroke-width=".8" stroke-linejoin="round"/>
  </g>
</svg>
