<!-- Glide modal — nested in slice-blade-modal.html so it rides the same two
     include points (footer.html, home layout). Reuses the Slice Blade
     panel/header/host classes; only the markup and assets/js/glide.js differ. -->
<div class="contact-modal slice-blade-modal" data-glide-modal hidden>
  <div class="contact-modal-backdrop" data-glide-close></div>
  <div class="contact-modal-panel slice-blade-panel" role="dialog" aria-modal="true" aria-labelledby="glide-title">
    <button type="button" class="contact-modal-close slice-blade-close" data-glide-close aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="slice-blade-header">
      <h2 class="slice-blade-title" id="glide-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3 11l18-7-7 18-2.5-7.5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        <span class="slice-blade-title-text">Glide</span>
      </h2>
      <div class="slice-blade-hud">
        <span class="slice-blade-hud-chip" data-glide-score>Score 0</span>
        <span class="slice-blade-hud-chip" data-glide-best>Best 0</span>
      </div>
    </div>
    <div class="slice-blade-host" data-glide-host>
      <canvas data-glide-canvas></canvas>
      <div class="slice-blade-notes">
        <p class="slice-blade-hint" data-glide-hint>Press Space, ↑ or tap to climb. Glide through the gates.</p>
      </div>
      <div class="slice-blade-share" data-glide-share hidden>
        <p class="slice-blade-share-score">Score <strong data-glide-share-score>0</strong>. Share it?</p>
        <div class="slice-blade-share-actions">
          <button type="button" class="slice-blade-share-btn slice-blade-share-btn-primary" data-glide-again>Play again</button>
          <button type="button" class="slice-blade-share-btn" data-glide-share-native hidden>Share</button>
          <button type="button" class="slice-blade-share-btn" data-glide-share-whatsapp>WhatsApp</button>
          <button type="button" class="slice-blade-share-btn" data-glide-share-instagram>Instagram</button>
          <button type="button" class="slice-blade-share-btn" data-glide-share-linkedin>LinkedIn</button>
          <button type="button" class="slice-blade-share-btn" data-glide-share-copy>Copy link</button>
          <button type="button" class="slice-blade-share-btn" data-glide-share-save>Save image</button>
        </div>
        <p class="slice-blade-share-note" data-glide-share-note aria-live="polite"></p>
      </div>
    </div>
  </div>
</div>
<script src="{{ '/assets/js/glide.js' | relative_url }}" defer></script>
