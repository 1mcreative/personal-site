# Analytics: empty by default so nothing renders, and no data goes
# anywhere, until a real Measurement ID is pasted in. See SEO-PLAYBOOK.md.
google_analytics: "G-V5VCNVVCJT"  # GA4 Measurement ID

# Search-engine verification, read natively by jekyll-seo-tag's own {% seo %}
# tag (no custom code needed). Left commented out rather than set to "":
# jekyll-seo-tag's own check only tests whether the key is present, not
# whether it's non-blank, so an empty string here would still emit an
# empty (harmless but sloppy) <meta> tag. Uncomment and fill in once you
# have real codes — see SEO-PLAYBOOK.md for where to get them.
# webmaster_verifications:
#   google: ""  # Search Console HTML-tag verification code
#   bing: ""    # Bing Webmaster Tools verification code

# og:image: NOT settable here. jekyll-seo-tag's `image` reads only from a
# page's own front matter (site.image is never merged in -- confirmed by
# reading the gem's own drop.rb) -- set `image:` per page instead (see
# index.md, resume/index.md, life/index.md, lab.md). assets/img/og-image.svg
# is the shared asset all of them point at.
#
# It's SVG, not PNG, since no image-rasterizing tool was available to
# produce a real raster file. Slack/Discord/iMessage-style previews
# generally render SVG og:image fine; Twitter/X and Facebook's scrapers are
# known to be unreliable with it and may show no preview at all. This is a
# real, partial fix, not a complete one -- swap in a real 1200x630 PNG at
# the same path on every page below for full compatibility once one exists.

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - CLAUDE.md
  - DESIGN.md
  - VERSIONING.md
  - SEO-PLAYBOOK.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - coming-soon
