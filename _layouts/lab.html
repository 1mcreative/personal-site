<!DOCTYPE html>
<html lang="en">
<head>
{% include head.html %}
<!-- Live demos on this page reuse the site's own real component CSS
     directly (not reimplementations) so nothing here can silently drift
     from what actually ships — home.css/professional.css/personal.css
     supply the classes every demo card's markup uses (globe, glitter,
     buttons, hint effects, the Instagram card grid, etc). tokens.css
     (shared components + view-transition) is already loaded by
     head.html for every page. -->
<link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/professional.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/personal.css' | relative_url }}">
</head>
<body class="theme-lab">
  <header class="lab-header">
    <div class="lab-header-inner">
      <a class="brand" href="/">Bhavesh Nakum</a>
      <nav aria-label="Lab">
        <a href="/resume/">The Grind</a>
        <a href="/life/">The Chaos</a>
        <span class="lab-header-current">Component Lab</span>
      </nav>
    </div>
  </header>
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}

  <!-- Shared modal: every card's "View effect" button opens this same
       dialog, reparenting that card's real demo node (not a copy) into
       #lab-modal-stage and its hidden code into #lab-modal-code. Built
       once here instead of once per card. -->
  <div id="lab-modal" class="lab-modal" hidden>
    <div class="lab-modal-backdrop" data-modal-close></div>
    <div class="lab-modal-panel" role="dialog" aria-modal="true" aria-labelledby="lab-modal-title">
      <button type="button" class="lab-modal-close" data-modal-close aria-label="Close">&times;</button>
      <div class="lab-modal-stage" id="lab-modal-stage"></div>
      <div class="lab-modal-body">
        <h3 id="lab-modal-title"></h3>
        <p class="lab-modal-desc" id="lab-modal-desc"></p>
        <p class="lab-modal-note" id="lab-modal-note" hidden></p>
        <button type="button" class="lab-modal-get-code" id="lab-modal-get-code">Get code</button>
        <div class="lab-modal-code" id="lab-modal-code"></div>
      </div>
    </div>
  </div>

  <script src="{{ '/assets/js/lab.js' | relative_url }}" defer></script>
</body>
</html>
