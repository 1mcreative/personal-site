<!DOCTYPE html>
<html lang="en">
<head>
{% include head.html %}
</head>
<body class="theme-home">
  <main id="main">
    {{ content }}
  </main>
  <footer class="site-footer home-footer">
    <p>&copy; {{ 'now' | date: "%Y" }} Bhavesh Nakum. <a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
  </footer>
  <script src="{{ '/assets/js/hero.js' | relative_url }}" defer></script>
  <!-- glitter.js: deprecated in favor of beyond-horizon.js (see home.css) —
       file kept intact, just not invoked, since a hidden canvas that's still
       running its own RAF draw loop would waste CPU/battery for nothing
       visible. Re-enabling is re-adding this one script tag. -->
  <script src="{{ '/assets/js/beyond-horizon.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/galaxy-button.js' | relative_url }}" defer></script>
  <!-- dissolve.js: deprecated per user feedback (see home.css) — its only
       triggers (.page-corner/.portal-orb) are hidden, so there's nothing
       left for it to attach to. File kept intact; re-enabling needs this
       tag back plus removing the one display:none rule in home.css. -->
  <!-- <script src="{{ '/assets/js/dissolve.js' | relative_url }}" defer></script> -->
</body>
</html>
