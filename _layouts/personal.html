<!DOCTYPE html>
<html lang="en">
<head>
{% include head.html %}
</head>
<body class="theme-personal">
  <!-- Synchronous, not deferred: this has to run before first paint, or the
       page would flash its normal (fully visible) state for a frame before
       life-intro.js catches up and hides everything — the exact opposite
       of a clean reveal. Scoped by this one class rather than styling the
       veil/fade-in as the default state, so a no-JS visitor (this never
       runs) just sees the page normally instead of a permanently black
       screen — see life-intro.js's own header comment for the full
       load-order reasoning. -->
  <script>document.body.classList.add('js-intro');</script>
  <div class="life-intro-veil" aria-hidden="true"></div>
  {% include nav-personal.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  <!-- Accretion Disc DEPRECATED, not deleted — superseded by Black Hole below. -->
  <!-- <script src="{{ '/assets/js/accretion-disc.js' | relative_url }}" defer></script> -->
  <!-- Black Hole (raymarched) DEPRECATED, not deleted — heavy per-pixel
       geodesic re-trace every frame made it slow to respond. Superseded by
       the bake-once/cheap-per-frame-shade version below. -->
  <!-- <script src="{{ '/assets/js/black-hole.js' | relative_url }}" defer></script> -->
  <script src="{{ '/assets/js/black-hole-lite.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/click-effects.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/section-nav.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/nav-autohide.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/instagram-feed.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/video-hover.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/life-intro.js' | relative_url }}" defer></script>
</body>
</html>
